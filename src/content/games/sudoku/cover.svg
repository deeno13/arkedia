<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sudoku cover</title>
  <desc id="desc">A large Sudoku grid with highlighted cells and title text.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="90" y="80" width="460" height="460" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="2">
    <path d="M140 130H500"/><path d="M140 170H500"/><path d="M140 210H500"/><path d="M140 250H500"/><path d="M140 290H500"/><path d="M140 330H500"/><path d="M140 370H500"/><path d="M140 410H500"/><path d="M140 450H500"/>
    <path d="M140 130V490"/><path d="M180 130V490"/><path d="M220 130V490"/><path d="M260 130V490"/><path d="M300 130V490"/><path d="M340 130V490"/><path d="M380 130V490"/><path d="M420 130V490"/><path d="M460 130V490"/>
  </g>
  <g stroke="#334155" stroke-width="5">
    <path d="M140 130H500"/><path d="M140 250H500"/><path d="M140 370H500"/><path d="M140 490H500"/>
    <path d="M140 130V490"/><path d="M260 130V490"/><path d="M380 130V490"/><path d="M500 130V490"/>
  </g>
  <g fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">
    <text x="200" y="205">5</text>
    <text x="320" y="205">8</text>
    <text x="440" y="205">3</text>
    <text x="200" y="325">7</text>
    <text x="320" y="325">1</text>
    <text x="440" y="325">9</text>
    <text x="200" y="445">4</text>
    <text x="320" y="445">6</text>
    <text x="440" y="445">2</text>
  </g>
  <rect x="300" y="250" width="40" height="40" fill="#fde68a" opacity="0.85"/>
  <text x="650" y="250" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="700">Sudoku</text>
  <text x="650" y="320" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="30">Constraint reasoning, elimination, and structure</text>
</svg>
