<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rock Paper Scissors cover</title>
  <desc id="desc">Three abstract icons representing rock, paper, and scissors on a bright background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="250" cy="310" r="110" fill="#e2e8f0"/>
  <rect x="500" y="205" width="180" height="220" rx="24" fill="#dbeafe"/>
  <path d="M900 220l90 90-70 70 70 70-90 90-90-90 70-70-70-70 90-90Z" fill="#fde68a"/>
  <text x="160" y="520" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Rock</text>
  <text x="545" y="520" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Paper</text>
  <text x="805" y="520" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Scissors</text>
  <text x="120" y="150" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="700">Rock Paper Scissors</text>
  <text x="120" y="205" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="28">Probability, patterns, and repeated outcomes</text>
</svg>
